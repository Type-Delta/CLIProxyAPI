services:
  cli-proxy-api:
    depends_on:
      clickhouse:
        condition: service_healthy
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-cpa}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-cpa}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  clickhouse-data:
