services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    restart: unless-stopped

  web:
    image: ${CLI_PROXY_WEB_IMAGE:-cli-proxy-api-web:latest}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        MANAGEMENT_CENTER_REF: ${MANAGEMENT_CENTER_REF:-main}
    depends_on:
      - cli-proxy-api
    ports:
      - "${CLI_PROXY_WEB_PORT:-8317}:80"
    restart: unless-stopped
