<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23edc22e'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='11' fill='%23fff' text-anchor='middle'%3E2048%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #faf8ef;
    --board: #bbada0;
    --cell: #cdc1b4;
    --text-dark: #776e65;
    --text-light: #f9f6f2;
    --gap: clamp(8px, 2.4vmin, 15px);
    --size: min(92vw, 480px);
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text-dark);
    font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 16px 0 32px;
  }
  main { width: var(--size); }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  h1 { margin: 0; font-size: clamp(44px, 12vw, 72px); line-height: 1; }
  .scores { display: flex; gap: 6px; }
  .score-box {
    background: var(--board);
    color: var(--text-light);
    border-radius: var(--radius);
    padding: 6px 14px;
    min-width: 76px;
    text-align: center;
  }
  .score-box .label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #eee4da; }
  .score-box output { display: block; font-size: 22px; font-weight: 700; }
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .bar p { margin: 0; font-size: 15px; line-height: 1.4; }
  button {
    font: inherit;
    font-weight: 700;
    background: #8f7a66;
    color: var(--text-light);
    border: 0;
    border-radius: var(--radius);
    padding: 10px 18px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: #9f8b77; }
  button:focus-visible { outline: 3px solid #3c78d8; outline-offset: 2px; }
  .board-wrap { position: relative; }
  .board {
    position: relative;
    width: var(--size);
    height: var(--size);
    background: var(--board);
    border-radius: var(--radius);
    padding: var(--gap);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: var(--gap);
    touch-action: none;
    user-select: none;
  }
  .board:focus-visible { outline: 3px solid #3c78d8; outline-offset: 3px; }
  .row { display: contents; }
  .cell {
    background: var(--cell);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: calc(var(--size) / 9);
    color: var(--text-dark);
    transition: background-color .1s ease;
  }
  .cell.new { animation: appear .18s ease; }
  .cell.merged { animation: pop .18s ease; }
  @keyframes appear { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    .cell.new, .cell.merged { animation: none; }
  }
  .v2    { background: #eee4da; }
  .v4    { background: #ede0c8; }
  .v8    { background: #f2b179; color: var(--text-light); }
  .v16   { background: #f59563; color: var(--text-light); }
  .v32   { background: #f67c5f; color: var(--text-light); }
  .v64   { background: #f65e3b; color: var(--text-light); }
  .v128  { background: #edcf72; color: var(--text-light); font-size: calc(var(--size) / 11); }
  .v256  { background: #edcc61; color: var(--text-light); font-size: calc(var(--size) / 11); }
  .v512  { background: #edc850; color: var(--text-light); font-size: calc(var(--size) / 11); }
  .v1024 { background: #edc53f; color: var(--text-light); font-size: calc(var(--size) / 14); }
  .v2048 { background: #edc22e; color: var(--text-light); font-size: calc(var(--size) / 14); }
  .vbig  { background: #3c3a32; color: var(--text-light); font-size: calc(var(--size) / 16); }
  .overlay {
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    background: rgba(238, 228, 218, .78);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    animation: fade .3s ease;
  }
  .overlay[hidden] { display: none; }
  .overlay.win { background: rgba(237, 194, 46, .6); color: var(--text-light); }
  .overlay h2 { margin: 0; font-size: clamp(32px, 9vw, 56px); }
  .overlay .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .help { margin-top: 18px; font-size: 14px; line-height: 1.5; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box">
        <span class="label" id="score-label">Score</span>
        <output id="score" aria-labelledby="score-label">0</output>
      </div>
      <div class="score-box">
        <span class="label" id="best-label">Best</span>
        <output id="best" aria-labelledby="best-label">0</output>
      </div>
    </div>
  </header>

  <div class="bar">
    <p>Join the tiles, get to <strong>2048</strong>.</p>
    <button type="button" id="restart" aria-label="Restart game">New Game</button>
  </div>

  <div class="board-wrap">
    <div id="board" class="board" role="grid" tabindex="0"
         aria-label="2048 game board, 4 by 4. Use arrow keys or W A S D to move tiles."
         aria-describedby="help"></div>

    <div id="overlay" class="overlay" role="dialog" aria-modal="false"
         aria-labelledby="overlay-title" hidden>
      <h2 id="overlay-title">Game over</h2>
      <div class="actions">
        <button type="button" id="keep-going" hidden>Keep going</button>
        <button type="button" id="try-again">Try again</button>
      </div>
    </div>
  </div>

  <p id="status" class="sr-only" aria-live="polite" aria-atomic="true"></p>

  <p class="help" id="help">
    <strong>How to play:</strong> use the arrow keys or W A S D (swipe on touch screens)
    to slide all tiles. Two tiles with the same number merge into one when they touch.
  </p>
</main>

<script>
(() => {
  "use strict";

  const SIZE = 4;
  const WIN_VALUE = 2048;
  const BEST_KEY = "qa-2048-best";

  const boardEl = document.getElementById("board");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const statusEl = document.getElementById("status");
  const overlayEl = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlay-title");
  const keepGoingBtn = document.getElementById("keep-going");
  const tryAgainBtn = document.getElementById("try-again");
  const restartBtn = document.getElementById("restart");

  let grid, score, best, won, keepPlaying, over;
  let cells = [];

  // localStorage may be unavailable (file://, privacy mode); fail soft.
  function loadBest() {
    try { return parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem(BEST_KEY, String(v)); } catch { /* ignore */ }
  }

  function buildBoard() {
    boardEl.textContent = "";
    cells = [];
    for (let r = 0; r < SIZE; r++) {
      const row = document.createElement("div");
      row.className = "row";
      row.setAttribute("role", "row");
      for (let c = 0; c < SIZE; c++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.setAttribute("role", "gridcell");
        cell.dataset.row = r;
        cell.dataset.col = c;
        row.appendChild(cell);
        cells.push(cell);
      }
      boardEl.appendChild(row);
    }
  }

  function emptyCells() {
    const out = [];
    for (let i = 0; i < SIZE * SIZE; i++) if (grid[i] === 0) out.push(i);
    return out;
  }

  function addRandomTile() {
    const empty = emptyCells();
    if (!empty.length) return -1;
    const idx = empty[Math.floor(Math.random() * empty.length)];
    grid[idx] = Math.random() < 0.9 ? 2 : 4;
    return idx;
  }

  // Returns the cell indices of each line, ordered in the direction tiles travel.
  function lines(dir) {
    const out = [];
    for (let a = 0; a < SIZE; a++) {
      const line = [];
      for (let b = 0; b < SIZE; b++) {
        let r, c;
        switch (dir) {
          case "left":  r = a; c = b; break;
          case "right": r = a; c = SIZE - 1 - b; break;
          case "up":    r = b; c = a; break;
          case "down":  r = SIZE - 1 - b; c = a; break;
        }
        line.push(r * SIZE + c);
      }
      out.push(line);
    }
    return out;
  }

  function move(dir) {
    if (over || (won && !keepPlaying)) return false;
    let moved = false;
    let gained = 0;
    const merged = new Set();

    for (const line of lines(dir)) {
      const values = line.map(i => grid[i]).filter(v => v !== 0);
      const result = [];
      for (let k = 0; k < values.length; k++) {
        if (k + 1 < values.length && values[k] === values[k + 1]) {
          const v = values[k] * 2;
          result.push(v);
          gained += v;
          merged.add(line[result.length - 1]);
          if (v >= WIN_VALUE && !won) won = true;
          k++; // each tile merges at most once per move
        } else {
          result.push(values[k]);
        }
      }
      while (result.length < SIZE) result.push(0);
      line.forEach((idx, k) => {
        if (grid[idx] !== result[k]) moved = true;
        grid[idx] = result[k];
      });
    }

    if (!moved) return false;

    score += gained;
    if (score > best) { best = score; saveBest(best); }
    const spawned = addRandomTile();
    render(merged, spawned);

    if (gained) announce(`Moved ${dir}. Merged for ${gained} points. Score ${score}.`);
    else announce(`Moved ${dir}. Score ${score}.`);

    if (won && !keepPlaying && !overlayShown) {
      showOverlay("win");
    } else if (!movesAvailable()) {
      over = true;
      showOverlay("over");
    }
    return true;
  }

  function movesAvailable() {
    if (emptyCells().length) return true;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r * SIZE + c];
        if (c + 1 < SIZE && grid[r * SIZE + c + 1] === v) return true;
        if (r + 1 < SIZE && grid[(r + 1) * SIZE + c] === v) return true;
      }
    }
    return false;
  }

  function render(merged = new Set(), spawned = -1) {
    grid.forEach((v, i) => {
      const cell = cells[i];
      const r = Math.floor(i / SIZE) + 1, c = (i % SIZE) + 1;
      cell.className = "cell";
      if (v) cell.classList.add(v <= WIN_VALUE ? `v${v}` : "vbig");
      // Restart animation by forcing reflow only on cells that need it.
      if (merged.has(i) || i === spawned) {
        void cell.offsetWidth;
        cell.classList.add(i === spawned ? "new" : "merged");
      }
      cell.textContent = v ? String(v) : "";
      cell.dataset.value = v;
      cell.setAttribute("aria-label", `Row ${r}, column ${c}: ${v ? v : "empty"}`);
    });
    scoreEl.textContent = String(score);
    bestEl.textContent = String(best);
  }

  let overlayShown = false;
  function showOverlay(kind) {
    overlayShown = true;
    overlayEl.hidden = false;
    overlayEl.classList.toggle("win", kind === "win");
    if (kind === "win") {
      overlayTitle.textContent = "You win!";
      keepGoingBtn.hidden = false;
      announce(`You reached ${WIN_VALUE}! Score ${score}.`);
      keepGoingBtn.focus();
    } else {
      overlayTitle.textContent = "Game over";
      keepGoingBtn.hidden = true;
      announce(`Game over. Final score ${score}.`);
      tryAgainBtn.focus();
    }
  }

  function hideOverlay() {
    overlayEl.hidden = true;
  }

  function announce(msg) { statusEl.textContent = msg; }

  function newGame() {
    grid = new Array(SIZE * SIZE).fill(0);
    score = 0;
    won = false;
    keepPlaying = false;
    over = false;
    overlayShown = false;
    hideOverlay();
    const a = addRandomTile();
    const b = addRandomTile();
    render(new Set(), -1);
    [a, b].forEach(i => cells[i].classList.add("new"));
    announce("New game started.");
  }

  const KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", W: "up", s: "down", S: "down", a: "left", A: "left", d: "right", D: "right"
  };

  document.addEventListener("keydown", e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const dir = KEYS[e.key];
    if (!dir) return;
    // Don't hijack keys while typing in a form field.
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    e.preventDefault();
    move(dir);
  });

  // Touch / pointer swipe support.
  let start = null;
  boardEl.addEventListener("pointerdown", e => { start = { x: e.clientX, y: e.clientY }; });
  boardEl.addEventListener("pointerup", e => {
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    start = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });
  boardEl.addEventListener("pointercancel", () => { start = null; });

  restartBtn.addEventListener("click", () => { newGame(); boardEl.focus(); });
  tryAgainBtn.addEventListener("click", () => { newGame(); boardEl.focus(); });
  keepGoingBtn.addEventListener("click", () => {
    keepPlaying = true;
    hideOverlay();
    announce("Keep going.");
    boardEl.focus();
  });

  best = loadBest();
  buildBoard();
  newGame();

  // QA-only hook (opt-in via ?test=1) to load a fixed board for deterministic checks.
  if (new URLSearchParams(location.search).get("test") === "1") {
    window.__game2048 = {
      setGrid(values) {
        if (!Array.isArray(values) || values.length !== SIZE * SIZE) throw new Error("bad grid");
        grid = values.map(v => Number(v) || 0);
        over = false; won = false; keepPlaying = false; overlayShown = false;
        hideOverlay();
        render();
      },
      state: () => ({ grid: grid.slice(), score, best, won, over, keepPlaying })
    };
  }
})();
</script>
</body>
</html>
